<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiStock 24 - Promo Sagas</title>
    <style>
        /* ================= CSS: ESTILOS BASE (COINCIDENTES CON INDEX) ================= */
        :root {
            --bg-color: #0d1117; /* Fondo oscuro para Sagas */
            --card-bg: #161b22;  
            --text-main: #ffffff; 
            --text-muted: #8b949e; 
            --accent-cyan: #005691; 
            --accent-pink: #ff00ff; 
            --search-accent: #007acc; 
            --pack-green: #00ff00;
            --saga-red: #ff0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding-top: 70px; }

        /* Barra de navegación superior */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: linear-gradient(90deg, #002857 0%, #005691 100%);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 1000; box-shadow: 0 2px 7px rgba(0,0,0,0.4);
        }
        
        .logo img { height: 45px; width: auto; filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.6)); display: block; cursor: pointer;}
        
        .nav-icons { display: flex; gap: 32px; align-items: center; cursor: pointer; color: white; }
        .nav-icons a { display: flex; align-items: center; transition: transform 0.2s; text-decoration: none; color: white; }
        .menu-icon-symbol { font-size: 26px; font-weight: bold; line-height: 1; }

        /* Título de sección */
        .section-title {
            margin: 20px 20px 16px 20px; font-size: 20px; font-weight: bold; text-transform: uppercase;
            border-left: 4px solid #004379; padding-left: 10px;
            display: flex; align-items: center; gap: 12px;
        }

        /* ================= DISEÑO DE RECUADROS DE SAGAS ================= */
        .sagas-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 0 20px 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 900px) {
            .sagas-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .saga-card {
            background: #080a0d;
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .saga-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .pack-label {
            color: var(--pack-green);
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }
        .pack-label span { font-size: 22px; }

        .price-btn {
            background: var(--accent-pink);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(255, 0, 255, 0.3);
        }

        .saga-name {
            color: var(--saga-red);
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .saga-desc {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Slider / Carrousel */
        .slider-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .slider-track {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding-bottom: 5px;
        }
        .slider-track::-webkit-scrollbar { display: none; }

        .poster-img {
            width: 110px;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .poster-img:hover { transform: scale(1.05); }

        .slide-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border: 1px solid #444;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            display: flex; justify-content: center; align-items: center;
        }
        .arrow-prev { left: -10px; }
        .arrow-next { right: -10px; }

        /* ================= MENÚ LATERAL (ESTILO ORIGINAL) ================= */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 4000;
            display: none; opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }
        
        .sidebar-container {
            position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
            background: #005691; z-index: 4001; transition: right 0.3s ease;
            display: flex; flex-direction: column; padding-top: 40px;
        }
        .sidebar-container.active { right: 0; }

        .menu-item {
            display: flex; align-items: center; padding: 16px 25px; color: white;
            font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s;
            text-transform: uppercase; gap: 15px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item svg, .menu-item span.icon { width: 20px; text-align: center; font-size: 18px; }

        /* ================= MODAL DETALLES ================= */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 5000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background-color: #161b22; border: 2px solid var(--accent-pink);
            border-radius: 15px; padding: 25px;
            width: 100%; max-width: 350px; text-align: center; color: white;
        }
        .close-btn {
            background: var(--accent-pink); color: white; border: none; width: 40px; height: 40px;
            border-radius: 50%; font-size: 22px; cursor: pointer; margin-top: 20px;
        }

        /* ================= FOOTER UNIVERSAL ================= */
        .site-footer {
            margin-top: 30px; padding: 24px 20px; border-top: 1px solid #30363d; background: #080a0d;
        }
        .footer-inner {
            display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 1200px; margin: 0 auto;
        }
        .footer-social { display: flex; gap: 34px; align-items: center; }
        .footer-social a { color: var(--search-accent); transition: transform 0.2s; }
        .footer-social a:hover { transform: scale(1.12); color: white; }
        .footer-copy { font-size: 12.5px; color: var(--text-muted); text-align: center; }

        @media (min-width: 700px) {
            .footer-inner { flex-direction: row; justify-content: space-between; }
        }
    </style>
</head>
<body>

            MÁS RECIENTES
        </div>
        <!-- BOTÓN PROMO SAGAS ACTIVO -->
        <div class="menu-item" onclick="location.reload()" style="background: rgba(255,255,255,0.1); color: var(--pack-green); font-weight: bold;">

    <!-- TÍTULO DE SECCIÓN -->
    <div class="section-title">

                </a>
                <a href="https://www.facebook.com/digistock24" target="_blank" aria-label="Facebook">

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.148.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347Z"></path><path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.892.526 3.66 1.44 5.166L2 22l4.958-1.412A9.955 9.955 0 0 0 12.001 22C17.524 22 22 17.523 22 12S17.524 2 12.001 2Zm0 18.187a8.15 8.15 0 0 1-4.156-1.134l-.298-.177-3.096.882.83-3.02-.194-.31A8.15 8.15 0 1 1 12.001 20.187Z"></path></svg>

    <!-- MODAL INFORMATIVO -->
    <div class="modal-overlay" id="modalSaga">
        <div class="modal-content">
            <div style="font-size: 40px; margin-bottom: 10px;">🍿</div>
            <h3 style="color: var(--accent-pink); margin-bottom: 10px;">PROMO SAGAS</h3>
            <h2 id="modal-saga-name" style="margin-bottom: 15px; text-transform: uppercase;"></h2>
            <p id="modal-saga-pack" style="font-weight: bold; color: var(--pack-green); font-size: 18px;"></p>
            <button class="close-btn" onclick="cerrarModal()">✕</button>
        </div>
    </div>

    <script>
        /* ================= JAVASCRIPT: LÓGICA DE DATOS Y MENÚ ================= */
        
        const SHEET_ID = '1jyU4bfJvmgnTnR2RY4NQ1Yp-rvcPD7GN5L_QzLXYlm0'; 
        const urlSagas = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=sagas`;

        // Footer Copyright
        document.getElementById('footer-copy').textContent = `\u00A9 ${new Date().getFullYear()} DIGISTOCK24 | Todos los derechos reservados`;

        async function cargarSagas() {
            try {
                const response = await fetch(urlSagas);
                const data = await response.text();
                const json = JSON.parse(data.substring(47).slice(0, -2));
                const rows = json.table.rows;

                // Fila 1 (Indice 0 en JS): Precios
                // Fila 2 (Indice 1 en JS): Cantidades
                const filaPrecios = rows[0].c;
                const filaCantidades = rows[1].c;
                
                const container = document.getElementById('sagas-container');

                // Fila 3 en adelante (Indice 2 en JS): Las Sagas
                for (let i = 2; i < rows.length; i++) {
                    const celdasSaga = rows[i].c;
                    if (!celdasSaga || !celdasSaga[0]) continue;

                    const nombreSaga = celdasSaga[0].v;
                    
                    // Identificar la última columna con texto/link de imagen (Col B en adelante)
                    let ultimaColIndex = 1;
                    let imagenesOriginales = [];

                    for (let j = 1; j < celdasSaga.length; j++) {
                        if (celdasSaga[j] && celdasSaga[j].v) {
                            imagenesOriginales.push(celdasSaga[j].v);
                            ultimaColIndex = j;
                        }
                    }

                    // Obtener Precio (Fila 1) y Cantidad (Fila 2) usando la columna detectada
                    const precio = filaPrecios[ultimaColIndex] ? filaPrecios[ultimaColIndex].v : '---';
                    const cantidadX = filaCantidades[ultimaColIndex] ? filaCantidades[ultimaColIndex].v : 'X';

                    // Preparar Carrousel (mínimo 5 imágenes)
                    let imagenesParaSlider = [...imagenesOriginales];
                    if (imagenesParaSlider.length > 0) {
                        while (imagenesParaSlider.length < 5) {
                            imagenesParaSlider.push(imagenesOriginales[0]);
                        }
                    }

                    // Crear la tarjeta (Card)
                    const card = document.createElement('div');
                    card.className = 'saga-card';
                    card.innerHTML = `
                        <div class="saga-header-row">
                            <div class="pack-label">PACK DE <span>${cantidadX}</span> PELÍCULAS</div>
                            <div class="price-btn">$${precio}</div>
                        </div>
                        <div class="saga-name">${nombreSaga}</div>
                        <div class="saga-desc">Descargables y también para ver online!</div>
                        
                        <div class="slider-container">
                            <button class="slide-arrow arrow-prev" onclick="moverSlider(this, -1)">❮</button>
                            <div class="slider-track">
                                ${imagenesParaSlider.map(img => `
                                    <img src="${img}" class="poster-img" onclick="abrirModal('${nombreSaga}', '${cantidadX}')">
                                `).join('')}
                            </div>
                            <button class="slide-arrow arrow-next" onclick="moverSlider(this, 1)">❯</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                console.error("Error al cargar la hoja de sagas:", error);
            }
        }

        // Funciones del Carrousel
        function moverSlider(boton, direccion) {
            const track = boton.parentElement.querySelector('.slider-track');
            track.scrollLeft += direccion * 130;
        }

        // Funciones del Menú Lateral
        const sidebar = document.getElementById('sidebar-container');
        const overlay = document.getElementById('sidebar-overlay');

        function abrirMenu() {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function cerrarMenu() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // Funciones del Modal
        function abrirModal(nombre, cant) {
            document.getElementById('modal-saga-name').textContent = nombre;
            document.getElementById('modal-saga-pack').textContent = `PACK DE ${cant} PELÍCULAS`;
            document.getElementById('modalSaga').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalSaga').style.display = 'none';
        }

        // Clic fuera del modal para cerrar
        window.onclick = function(event) {
            const modal = document.getElementById('modalSaga');
            if (event.target == modal) cerrarModal();
        }

        // Iniciar carga
        cargarSagas();
    </script>
</body>
</html>
