<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiStock 24 - Promo Sagas</title>
    <style>
        /* ================= CSS: ESTILOS BASE ================= */
        :root {
            --bg-color: #0d1117; 
            --card-bg: #161b22;  
            --text-main: #ffffff; 
            --text-muted: #8b949e; 
            --accent-cyan: #005691; 
            --accent-pink: #ff00ff; 
            --search-accent: #007acc; 
            --pack-green: #00ff00;
            --saga-red: #ff0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-top: 70px; }

        /* Barra de navegación superior */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: linear-gradient(90deg, #002857 0%, #005691 100%);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 1000; box-shadow: 0 2px 7px rgba(0,0,0,0.4);
        }
        .logo img { height: 45px; cursor: pointer; filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.6)); }
        .nav-icons { display: flex; gap: 32px; align-items: center; cursor: pointer; color: white; }
        .menu-icon-symbol { font-size: 26px; font-weight: bold; line-height: 1; }

        /* Título de sección */
        .section-title {
            margin: 20px 20px 16px 20px; font-size: 20px; font-weight: bold; text-transform: uppercase;
            border-left: 4px solid #004379; padding-left: 10px; display: flex; align-items: center; gap: 12px;
        }

        /* GRID DE SAGAS */
        .sagas-grid {
            display: grid; grid-template-columns: 1fr; gap: 20px; padding: 0 20px 40px 20px;
            max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 900px) { .sagas-grid { grid-template-columns: repeat(3, 1fr); } }

        /* TARJETA DE SAGA */
        .saga-card {
            background: #080a0d; border: 1px solid #30363d; border-radius: 15px;
            padding: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        .saga-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        
        .pack-label { color: var(--pack-green); font-weight: bold; font-size: 16px; text-transform: uppercase; }
        /* El número X resaltado 2px más grande */
        .pack-label span { font-size: 18px; display: inline-block; transform: translateY(1px); }

        .price-btn {
            background: var(--accent-pink); color: white; padding: 6px 14px;
            border-radius: 8px; font-weight: bold; font-size: 18px;
            box-shadow: 0 2px 5px rgba(255, 0, 255, 0.3);
        }

        .saga-name { color: var(--saga-red); font-size: 26px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .saga-desc { color: #cccccc; font-size: 14px; margin-bottom: 15px; }

        /* SLIDER */
        .slider-container { position: relative; display: flex; align-items: center; margin-top: auto; }
        .slider-track { display: flex; gap: 10px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 5px; }
        .slider-track::-webkit-scrollbar { display: none; }
        .poster-img { width: 110px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .poster-img:hover { transform: scale(1.05); }

        .slide-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.7); border: 1px solid #444; color: white;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 5;
            display: flex; justify-content: center; align-items: center;
        }
        .arrow-prev { left: -10px; } .arrow-next { right: -10px; }

        /* MENÚ LATERAL */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 4000; display: none; }
        .sidebar-overlay.active { display: block; }
        .sidebar-container { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #005691; z-index: 4001; transition: right 0.3s ease; display: flex; flex-direction: column; padding-top: 40px; }
        .sidebar-container.active { right: 0; }
        .menu-item { display: flex; align-items: center; padding: 16px 25px; color: white; font-size: 15px; font-weight: 500; cursor: pointer; text-transform: uppercase; gap: 15px; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 5000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background-color: #161b22; border: 2px solid var(--accent-pink); border-radius: 15px; padding: 25px; width: 100%; max-width: 350px; text-align: center; color: white; }
        .close-btn { background: var(--accent-pink); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; cursor: pointer; margin-top: 20px; }

        /* FOOTER */
        .site-footer { margin-top: 30px; padding: 24px 20px; border-top: 1px solid #30363d; background: #080a0d; }
        .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 1200px; margin: 0 auto; }
        .footer-social { display: flex; gap: 34px; align-items: center; }
        .footer-social a { color: var(--search-accent); transition: transform 0.2s; }
        .footer-copy { font-size: 12.5px; color: var(--text-muted); text-align: center; }
        @media (min-width: 700px) { .footer-inner { flex-direction: row; justify-content: space-between; } }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.href='index.html'"><img src="https://i.imgur.com/2XOt5Zx.png" alt="DigiStock 24"></div>
        <div class="nav-icons"><span class="menu-icon-symbol" onclick="abrirMenu()">☰</span></div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="cerrarMenu()"></div>
    <nav class="sidebar-container" id="sidebar-container">
        <div class="menu-item" onclick="location.href='index.html'">INICIO</div>
        <div class="menu-item" onclick="location.href='index.html'">ESTRENOS</div>
        <div class="menu-item" onclick="location.href='index.html'">MÁS RECIENTES</div>
        <div class="menu-item" style="color: var(--pack-green); font-weight: bold;">🍿 PROMO SAGAS</div>
    </nav>

    <div class="section-title"><span>🍿</span> PROMO SAGAS</div>

    <main class="sagas-grid" id="sagas-container"></main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-social">
                <a href="https://www.instagram.com/digistock24/" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="https://wa.me/5491125122574" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.148.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347Z"></path><path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.892.526 3.66 1.44 5.166L2 22l4.958-1.412A9.955 9.955 0 0 0 12.001 22C17.524 22 22 17.523 22 12S17.524 2 12.001 2Zm0 18.187a8.15 8.15 0 0 1-4.156-1.134l-.298-.177-3.096.882.83-3.02-.194-.31A8.15 8.15 0 1 1 12.001 20.187Z"></path></svg>
                </a>
            </div>
            <div class="footer-copy" id="footer-copy"></div>
        </div>
    </footer>

    <div class="modal-overlay" id="modalSaga">
        <div class="modal-content">
            <div style="font-size: 40px;">🍿</div>
            <h3 style="color: var(--accent-pink); margin-bottom: 10px;">PROMO SAGAS</h3>
            <h2 id="modal-saga-name" style="margin-bottom: 15px; text-transform: uppercase;"></h2>
            <p id="modal-saga-pack" style="font-weight: bold; color: var(--pack-green); font-size: 18px;"></p>
            <button class="close-btn" onclick="cerrarModal()">✕</button>
        </div>
    </div>

    <script>
        const SHEET_ID = '1jyU4bfJvmgnTnR2RY4NQ1Yp-rvcPD7GN5L_QzLXYlm0'; 
        const urlSagas = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=sagas`;

        document.getElementById('footer-copy').textContent = `\u00A9 ${new Date().getFullYear()} DIGISTOCK24 | Todos los derechos reservados`;

        async function cargarSagas() {
            try {
                const response = await fetch(urlSagas);
                const data = await response.text();
                const json = JSON.parse(data.substring(47).slice(0, -2));
                const rows = json.table.rows;

                // Fila 1 (Indice 0): Precios
                // Fila 2 (Indice 1): Cantidades
                const filaPrecios = rows[0].c;
                const filaCantidades = rows[1].c;
                
                const container = document.getElementById('sagas-container');

                // Fila 3 en adelante (Indice 2): SAGAS. Empezamos en i=2 para incluir "Los Vengadores"
                for (let i = 2; i < rows.length; i++) {
                    const celdasSaga = rows[i].c;
                    if (!celdasSaga || !celdasSaga[0]) continue;

                    const nombreSaga = celdasSaga[0].v;
                    
                    // Buscar la última columna con texto (imagenes)
                    let ultimaColIndex = 0;
                    let imagenesOriginales = [];

                    for (let j = 1; j < celdasSaga.length; j++) {
                        if (celdasSaga[j] && celdasSaga[j].v !== null && celdasSaga[j].v !== "") {
                            imagenesOriginales.push(celdasSaga[j].v);
                            ultimaColIndex = j;
                        }
                    }

                    // PRECIO de Fila 1 (Index 0) y CANTIDAD de Fila 2 (Index 1) de la última columna detectada
                    const precio = (filaPrecios[ultimaColIndex] && filaPrecios[ultimaColIndex].v) ? filaPrecios[ultimaColIndex].v : '---';
                    const cantidadX = (filaCantidades[ultimaColIndex] && filaCantidades[ultimaColIndex].v) ? filaCantidades[ultimaColIndex].v : 'X';

                    let sliderImgs = [...imagenesOriginales];
                    if (sliderImgs.length > 0) {
                        while (sliderImgs.length < 5) { sliderImgs.push(imagenesOriginales[0]); }
                    }

                    const card = document.createElement('div');
                    card.className = 'saga-card';
                    card.innerHTML = `
                        <div class="saga-header-row">
                            <div class="pack-label">PACK DE <span>${cantidadX}</span> PELÍCULAS</div>
                            <div class="price-btn">$${precio}</div>
                        </div>
                        <div class="saga-name">${nombreSaga}</div>
                        <div class="saga-desc">Descargables y también para ver online!</div>
                        <div class="slider-container">
                            <button class="slide-arrow arrow-prev" onclick="moverSlider(this, -1)">❮</button>
                            <div class="slider-track">
                                ${sliderImgs.map(img => `<img src="${img}" class="poster-img" onclick="abrirModal('${nombreSaga}', '${cantidadX}')">`).join('')}
                            </div>
                            <button class="slide-arrow arrow-next" onclick="moverSlider(this, 1)">❯</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (e) { console.error(e); }
        }

        function moverSlider(btn, dir) { btn.parentElement.querySelector('.slider-track').scrollLeft += dir * 130; }
        function abrirMenu() { document.getElementById('sidebar-container').classList.add('active'); document.getElementById('sidebar-overlay').style.display = 'block'; }
        function cerrarMenu() { document.getElementById('sidebar-container').classList.remove('active'); document.getElementById('sidebar-overlay').style.display = 'none'; }
        function abrirModal(nom, cant) {
            document.getElementById('modal-saga-name').textContent = nom;
            document.getElementById('modal-saga-pack').textContent = `PACK DE ${cant} PELÍCULAS`;
            document.getElementById('modalSaga').style.display = 'flex';
        }
        function cerrarModal() { document.getElementById('modalSaga').style.display = 'none'; }
        
        window.onclick = (e) => { if (e.target == document.getElementById('modalSaga')) cerrarModal(); }
        cargarSagas();
    </script>
</body>
</html>
